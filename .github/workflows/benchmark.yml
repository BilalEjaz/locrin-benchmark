name: benchmark
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Locrin version tag to measure (blank: latest release)"
        default: ""
      commit:
        description: "Commit and push the results (false: run only)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: benchmark
  cancel-in-progress: false
jobs:
  measure:
    # Scheduled runs commit results, so they only run on main. Until main is
    # the default branch the cron does nothing; manual dispatch still works.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          v="$VERSION"
          if [[ -z "$v" ]]; then v=$(gh release view --repo BilalEjaz/locrin --json tagName --jq .tagName); fi
          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "not a version tag: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "schedule" ]]; then
            # A scheduled run publishes only when the labels cover it (bench/main.py exits 4 otherwise, and
            # nothing is committed): every label file confirmed by pass two, every finding labelled, every
            # labelled finding reproduced. It skips a version only when its run.json records such a complete,
            # publishable run of that version over the current corpus and labels, so a failed or uncovered
            # run, or a version whose corpus or labels changed since, is measured again.
            reason=""
            if complete=$(python -m bench.inputs --complete "results/$v/run.json" --version "$v" --corpus corpus --labels labels); then
              reason="$complete"
            else
              echo "measure: $complete"
              if ! compgen -G "corpus/*.json" >/dev/null; then reason="corpus/ holds no record yet"
              elif ! compgen -G "labels/*.json" >/dev/null; then reason="labels/ holds no label file yet"
              fi
            fi
            if [[ -n "$reason" ]]; then echo "skip: $reason"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Run
        id: run
        if: steps.v.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          code=0
          ./run.sh "$V" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3: at least one diff ran and every diff that did not is a confirmed gone source (its repository
          # answers 404, or the server lacks its commit after a fetch). The table says how many ran, so the
          # results still publish and the last step flags them. Any other failure, a network error included,
          # stops here and nothing is committed; the next scheduled run measures the version again. 4 means
          # the labels do not cover the run (unlabelled findings, a diff with no label file, labels written for
          # another locrin version, a label file pass two never confirmed, or a labelled finding this run did
          # not report): fix the labels for this version, and the next scheduled run measures it.
          if [[ "$code" != 0 && "$code" != 3 ]]; then exit "$code"; fi
      - name: Commit results
        if: steps.v.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.commit)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "locrin-benchmark"
          git config user.email "benchmark@locrin.com"
          git add "results/$V" README.md
          git diff --cached --quiet || git commit -m "results: locrin $V"
          git push
      - name: Flag diffs whose source is gone
        if: steps.run.outputs.code == '3'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # One JSON string per line, so a message can never start a workflow command.
          python -c 'import json, sys; [print("source gone:", json.dumps(g["id"] + ": " + g["evidence"])) for g in json.load(open(sys.argv[1]))["gone"]]' "results/$V/run.json"
          echo "Prune the records whose commit is gone: python -m bench.build_corpus --check-gone"
          exit 1
