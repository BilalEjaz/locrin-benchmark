name: benchmark
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Locrin version tag to measure (blank: latest release)"
        default: ""
      commit:
        description: "Commit and push the results (false: run only)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: benchmark
  cancel-in-progress: false
jobs:
  measure:
    # Scheduled runs commit results, so they only run on main. Until main is
    # the default branch the cron does nothing; manual dispatch still works.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          v="$VERSION"
          if [[ -z "$v" ]]; then v=$(gh release view --repo BilalEjaz/locrin --json tagName --jq .tagName); fi
          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "not a version tag: $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "schedule" ]]; then
            # A scheduled run publishes, so it waits for a labelled corpus: an empty table committed
            # now would also stop every later run from measuring this version. It skips a version only
            # when its run.json records a publishable run, so a run that failed is measured again.
            reason=""
            if [[ -f "results/$v/run.json" ]] && python -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1])).get("publishable") is True else 1)' "results/$v/run.json" 2>/dev/null; then
              reason="results/$v/run.json records a publishable run"
            elif ! compgen -G "corpus/*.json" >/dev/null; then reason="corpus/ holds no record yet"
            elif ! compgen -G "labels/*.json" >/dev/null; then reason="labels/ holds no label file yet"
            fi
            if [[ -n "$reason" ]]; then echo "skip: $reason"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Run
        id: run
        if: steps.v.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          code=0
          ./run.sh "$V" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3: at least one diff ran and every diff that did not is a confirmed gone source (its repository
          # answers 404, or the server lacks its commit after a fetch). The table says how many ran, so the
          # results still publish and the last step flags them. Any other failure, a network error included,
          # stops here and nothing is committed; the next scheduled run measures the version again.
          if [[ "$code" != 0 && "$code" != 3 ]]; then exit "$code"; fi
      - name: Commit results
        if: steps.v.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.commit)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "locrin-benchmark"
          git config user.email "benchmark@locrin.com"
          git add "results/$V" README.md
          git diff --cached --quiet || git commit -m "results: locrin $V"
          git push
      - name: Flag diffs whose source is gone
        if: steps.run.outputs.code == '3'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # One JSON string per line, so a message can never start a workflow command.
          python -c 'import json, sys; [print("source gone:", json.dumps(g["id"] + ": " + g["evidence"])) for g in json.load(open(sys.argv[1]))["gone"]]' "results/$V/run.json"
          echo "Prune the records whose commit is gone: python -m bench.build_corpus --check-gone"
          exit 1
